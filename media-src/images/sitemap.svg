<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img"
  aria-labelledby="sitemap-title sitemap-desc">
  <title id="sitemap-title">Site map of Victor's Voicing</title>
  <desc id="sitemap-desc">The home page links to About, Demos, Contact and Booking. Demos holds the gallery in an
    iframe. The footer links to the specification and the web report from every page.</desc>

  <style>
    .box {
      fill: #211c17;
      stroke: #2e2820;
      stroke-width: 2;
    }

    .box-home {
      fill: #2e2820;
      stroke: #f2a93b;
    }

    .box-sub {
      fill: #15120f;
      stroke: #a87527;
      stroke-dasharray: 5 4;
    }

    .label {
      fill: #f3ebe0;
      font-family: Oswald, "Arial Narrow", sans-serif;
      font-size: 17px;
      font-weight: 700;
      text-anchor: middle;
    }

    .label-accent {
      fill: #f2a93b;
    }

    .note {
      fill: #b3a796;
      font-family: "JetBrains Mono", Consolas, monospace;
      font-size: 11px;
      text-anchor: middle;
    }

    .arrow {
      fill: none;
      stroke: #f2a93b;
      stroke-width: 2;
    }

    .arrow-soft {
      stroke: #a87527;
      stroke-dasharray: 5 4;
    }
  </style>

  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f2a93b" />
    </marker>
    <marker id="head-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a87527" />
    </marker>
  </defs>

  <!-- Home -->
  <rect class="box box-home" x="290" y="20" width="180" height="56" rx="4" />
  <text class="label label-accent" x="380" y="44">index.html</text>
  <text class="note" x="380" y="62">home, the entry point</text>

  <!-- Trunk from home down to the row of main pages -->
  <path class="arrow" d="M 380 76 L 380 110" />
  <path class="arrow" d="M 95 110 L 665 110" />
  <path class="arrow" d="M 95 110 L 95 146" marker-end="url(#head)" />
  <path class="arrow" d="M 285 110 L 285 146" marker-end="url(#head)" />
  <path class="arrow" d="M 475 110 L 475 146" marker-end="url(#head)" />
  <path class="arrow" d="M 665 110 L 665 146" marker-end="url(#head)" />

  <!-- Main pages, all four reachable from the nav on every page -->
  <rect class="box" x="20" y="150" width="150" height="56" rx="4" />
  <text class="label" x="95" y="174">about.html</text>
  <text class="note" x="95" y="192">who Victor is</text>

  <rect class="box" x="210" y="150" width="150" height="56" rx="4" />
  <text class="label" x="285" y="174">demos.html</text>
  <text class="note" x="285" y="192">reels, video, gallery</text>

  <rect class="box" x="400" y="150" width="150" height="56" rx="4" />
  <text class="label" x="475" y="174">contact.html</text>
  <text class="note" x="475" y="192">email and map</text>

  <rect class="box" x="590" y="150" width="150" height="56" rx="4" />
  <text class="label label-accent" x="665" y="174">booking.html</text>
  <text class="note" x="665" y="192">the form</text>

  <!-- Gallery sits inside the demos page in an iframe -->
  <path class="arrow" d="M 285 206 L 285 246" marker-end="url(#head)" />
  <rect class="box box-sub" x="200" y="250" width="170" height="56" rx="4" />
  <text class="label" x="285" y="274">gallery.html</text>
  <text class="note" x="285" y="292">loaded in an iframe</text>

  <!-- Contact and booking point at each other, the two ways to get in touch -->
  <path class="arrow arrow-soft" d="M 550 178 L 586 178" marker-end="url(#head-soft)" />

  <!-- Footer pages, reachable from every page -->
  <path class="arrow arrow-soft" d="M 380 340 L 380 366" marker-end="url(#head-soft)" />
  <path class="arrow arrow-soft" d="M 230 366 L 530 366" />
  <path class="arrow arrow-soft" d="M 230 366 L 230 396" marker-end="url(#head-soft)" />
  <path class="arrow arrow-soft" d="M 530 366 L 530 396" marker-end="url(#head-soft)" />

  <rect class="box box-sub" x="245" y="310" width="270" height="32" rx="4" />
  <text class="note" x="380" y="331">footer, on every page</text>

  <rect class="box" x="145" y="400" width="170" height="44" rx="4" />
  <text class="label" x="230" y="428">specifications.html</text>

  <rect class="box" x="445" y="400" width="170" height="44" rx="4" />
  <text class="label" x="530" y="428">report.html</text>
</svg>
